# Publication automatique de FAALA GEUN sur GitHub Pages
#
# Se declenche a chaque modification du contenu (depuis le telephone,
# l'ordinateur, ou GitHub directement) : prepare la version publique
# puis la met en ligne.
#
# Pourquoi GitHub Pages : gratuit et sans limite de publication pour
# les depots publics. Netlify, en formule gratuite, bloque les mises
# en ligne des que ses 300 credits mensuels sont consommes.

name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:        # permet aussi de relancer a la main

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication a la fois : si deux enregistrements se suivent,
# seul le plus recent part en ligne.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Preparer la version publique
        run: node build.js

      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deposer le site construit
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Mettre en ligne
        id: deploiement
        uses: actions/deploy-pages@v4
