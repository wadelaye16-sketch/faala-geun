<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FAALA GEUN — Communauté Mouride</title>
  <meta name="description" content="FAALA GEUN : l'application de la communauté mouride. Khassaïdes, conférences, chants religieux, événements et actualités réunis en un seul endroit.">
  <meta name="theme-color" content="#0B4D3B">
  <link rel="canonical" href="https://wadelaye16-sketch.github.io/faala-geun/">

  <!-- Aperçu affiché lors d'un partage sur WhatsApp, Facebook, etc. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="FAALA GEUN">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:title" content="FAALA GEUN — Communauté Mouride">
  <meta property="og:description" content="Khassaïdes, conférences, chants religieux, événements et actualités de la communauté mouride.">
  <meta property="og:url" content="https://wadelaye16-sketch.github.io/faala-geun/">
  <meta property="og:image" content="https://wadelaye16-sketch.github.io/faala-geun/assets/img/partage.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="FAALA GEUN — Communauté Mouride">
  <meta name="twitter:description" content="Khassaïdes, conférences, chants religieux, événements et actualités de la communauté mouride.">
  <meta name="twitter:image" content="https://wadelaye16-sketch.github.io/faala-geun/assets/img/partage.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FAALA GEUN">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="#/accueil">
      <img class="brand__logo" src="assets/icons/icon.svg" alt="">
      <span class="brand__text">
        <strong data-bind="site.nom">FAALA GEUN</strong>
        <small data-bind="site.slogan">Communauté Mouride</small>
      </span>
    </a>

    <nav class="nav-desktop" aria-label="Navigation principale">
      <a href="#/accueil"     data-route="accueil">Accueil</a>
      <a href="#/videos"      data-route="videos">Vidéos</a>
      <a href="#/musiques"    data-route="musiques">Musiques</a>
      <a href="#/boutique"    data-route="boutique">Boutique</a>
      <a href="#/evenements"  data-route="evenements">Événements</a>
      <a href="#/actualites"  data-route="actualites">Actualités</a>
    </nav>

    <div class="topbar__actions">
      <button id="btn-search" class="icon-btn" aria-label="Rechercher" title="Rechercher">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
      <button id="btn-theme" class="icon-btn" aria-label="Changer le thème" title="Thème clair / sombre">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button id="btn-install" class="btn btn--gold" hidden>Installer</button>
    </div>
  </div>

  <div id="searchbar" class="searchbar" hidden>
    <input id="search-input" type="search" placeholder="Rechercher une vidéo, un khassaïd, un événement…" autocomplete="off">
    <button id="search-close" class="icon-btn" aria-label="Fermer la recherche">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</header>

<main id="app" class="app" tabindex="-1">
  <div class="loader"><span class="spinner"></span> Chargement…</div>
  <noscript>
    <h1>FAALA GEUN — Communauté Mouride</h1>
    <p>FAALA GEUN rassemble les vidéos, khassaïdes, chants religieux, conférences,
       événements et actualités de la communauté mouride, en un seul endroit.</p>
    <p>Cette application a besoin de JavaScript pour fonctionner.
       Active-le dans ton navigateur, puis recharge la page.</p>
  </noscript>
</main>

<footer class="footer">
  <p><span data-bind="site.nom">FAALA GEUN</span> — <span data-bind="site.pied">Serigne Touba, Diaraaf</span></p>
  <p class="footer__small">Application communautaire · <span id="year"></span></p>
</footer>

<!-- Lecteur audio persistant -->
<div id="player" class="player" hidden aria-live="polite">
  <img id="player-cover" class="player__cover" src="assets/icons/icon.svg" alt="">
  <div class="player__meta">
    <strong id="player-title">—</strong>
    <small id="player-artist"></small>
    <input id="player-seek" class="player__seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Progression">
    <div class="player__time"><span id="player-cur">0:00</span> / <span id="player-dur">0:00</span></div>
  </div>
  <div class="player__controls">
    <button id="player-prev" class="icon-btn" aria-label="Précédent">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 20 9 12l10-8zM5 4v16"/></svg>
    </button>
    <button id="player-play" class="icon-btn icon-btn--main" aria-label="Lecture / Pause">
      <svg id="ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4l14 8-14 8z"/></svg>
      <svg id="ic-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 4v16M17 4v16"/></svg>
    </button>
    <button id="player-next" class="icon-btn" aria-label="Suivant">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4l10 8-10 8zM19 4v16"/></svg>
    </button>
    <button id="player-close" class="icon-btn" aria-label="Fermer le lecteur">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <audio id="audio" preload="metadata"></audio>
</div>

<!-- Barre de navigation mobile -->
<nav class="tabbar" aria-label="Navigation mobile">
  <a href="#/accueil" data-route="accueil">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V21H3z"/></svg><span>Accueil</span>
  </a>
  <a href="#/videos" data-route="videos">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m10 9 5 3-5 3z"/></svg><span>Vidéos</span>
  </a>
  <a href="#/musiques" data-route="musiques">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg><span>Musiques</span>
  </a>
  <a href="#/boutique" data-route="boutique">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h16l-1.2 12H5.2z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg><span>Boutique</span>
  </a>
  <a href="#/evenements" data-route="evenements">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Agenda</span>
  </a>
  <a href="#/actualites" data-route="actualites">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h13v14H4z"/><path d="M17 9h3v8a2 2 0 0 1-2 2h-1zM7 9h7M7 13h7"/></svg><span>Actus</span>
  </a>
</nav>

<!-- Fenêtre vidéo -->
<div id="modal" class="modal" hidden>
  <div class="modal__backdrop" data-close></div>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <button class="modal__close icon-btn" data-close aria-label="Fermer">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
    <div id="modal-media" class="modal__media"></div>
    <div class="modal__info">
      <h2 id="modal-title"></h2>
      <p id="modal-desc"></p>
    </div>
  </div>
</div>

<script src="data/contenu.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
